# Pre-commit hooks configuration
# Install: pip install pre-commit
# Activate: pre-commit install

repos:
  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--config=pyproject.toml]

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--settings-path=pyproject.toml]

  # Linting with Flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --exclude=migrations]

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-Flask==0.13.1]
        exclude: ^(migrations/|app/static/)

  # Security scanning with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, -f]
        exclude: ^tests/

  # Generic file pre-commit checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(app/static/)

      - id: end-of-file-fixer
        exclude: ^(app/static/)

      - id: check-yaml
      - args: [--unsafe]

      - id: check-added-large-files
        args: [--maxkb=1000]

      - id: check-merge-conflict
        exclude: ^(app/static/)

      - id: detect-private-key
        exclude: ^(credentials.env|app/config/)

  # JavaScript/CSS formatting (if adding in future)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, css, scss]
        exclude: ^(app/static/vendor/)

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        files: ^Dockerfile$
        args: [--ignore=DL3013]  # Ignore pinned version warning for now

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck
    rev: v0.9.0
    hooks:
      - id: shellcheck
        files: ^.*\.sh$
        exclude: ^(app/static/)

  # Markdown linting
  - repo: https://github.com/igorshubov/markdownlint
    rev: v0.39.0
    hooks:
      - id: markdownlint
        files: ^.*\.md$
        args: [--disable=MD013, MD041, MD033, MD046]

# CI configuration
ci:
  autofix_commit_msg: '[pre-commit.ci] auto fixes from {repo} PR #{pr_number}'
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  skip: [migrations]
  submodules: false
