{% extends "base.html" %}

{% block content %}
<div class="container h-100">
    <div class="row h-100 align-items-center justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-heart-pulse-fill"></i>
                </div>
                <h3 class="fw-bold text-primary">Join Health Navigator</h3>
                <p class="text-muted">Create your patient profile today</p>
            </div>

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">

                    {% if error %}
                        <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
                            <i class="bi bi-exclamation-circle-fill"></i>
                            <div>{{ error }}</div>
                        </div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-medium small">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-vcard"></i></span>
                                <input type="text" name="full_name" class="form-control bg-light border-start-0 ps-0" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted fw-medium small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control bg-light border-start-0 ps-0" placeholder="jdoe" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted fw-medium small">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" name="email" class="form-control bg-light border-start-0 ps-0" placeholder="john@example.com" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted fw-medium small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control bg-light border-start-0 ps-0" placeholder="••••••••" required>
                            </div>
                            <div class="form-text small mt-1">Must be at least 8 characters.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">
                            Create Account
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light border-0 py-3 text-center rounded-bottom-4">
                    <small class="text-muted">Already have an account?</small>
                    <a href="{{ url_for('main.login') }}" class="text-primary fw-semibold text-decoration-none ms-1">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
