{% extends "base.html" %}

{% block content %}
<div class="container h-100">
    <div class="row h-100 align-items-center justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center shadow-sm mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
                    <i class="bi bi-heart-pulse-fill"></i>
                </div>
                <h3 class="fw-bold text-primary">Health Navigator</h3>
                <p class="text-muted">Secure Patient Portal</p>
            </div>

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h4 class="mb-4 fw-bold">Welcome Back</h4>

                    {% if error %}
                        <div class="alert alert-danger d-flex align-items-center gap-2 mb-4" role="alert">
                            <i class="bi bi-exclamation-circle-fill"></i>
                            <div>{{ error }}</div>
                        </div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-medium small">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control bg-light border-start-0 ps-0" placeholder="Enter your username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted fw-medium small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control bg-light border-start-0 ps-0" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold shadow-sm">
                            Sign In
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light border-0 py-3 text-center rounded-bottom-4">
                    <small class="text-muted">Don't have an account?</small>
                    <a href="{{ url_for('main.register') }}" class="text-primary fw-semibold text-decoration-none ms-1">Register Now</a>
                </div>
            </div>

            <div class="text-center mt-4 text-muted small">
                <i class="bi bi-shield-lock-fill me-1"></i>
                Your data is encrypted and secure.
            </div>
        </div>
    </div>
</div>
{% endblock %}
