<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Health Navigator{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/base.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/layout.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/components.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Animated Background -->
    <div class="bg-animated"></div>
    <div class="bg-glow-layer"></div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glass-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <div class="brand-logo">
                    <div class="logo-icon">
                        <i class="bi bi-heart-pulse-fill"></i>
                        <div class="pulse-ring"></div>
                    </div>
                    <span class="brand-text">
                        <span class="brand-name">Health</span>
                        <span class="brand-accent">Navigator</span>
                    </span>
                </div>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    {% if session.get('user_id') %}
                    <li class="nav-item">
                        <a class="nav-link nav-btn-logout" href="{{ url_for('main.logout') }}">
                            <i class="bi bi-box-arrow-right me-2"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                    {% else %}
                    <li class="nav-item me-2">
                        <a class="nav-link nav-btn-outline" href="{{ url_for('main.login') }}">
                            <span>Sign In</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-btn-primary" href="{{ url_for('main.register') }}">
                            <span>Get Started</span>
                            <i class="bi bi-arrow-right ms-2"></i>
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
